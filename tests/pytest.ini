[pytest]
testpaths = .
markers =
    backend: Requires the Express backend running at BACKEND_URL
    ai_service: Requires the FastAPI ai-service running at AI_SERVICE_URL
    ocr: Requires OCR library (easyocr or pytesseract) to be installed
    slow: Test takes >5 s (embedding load, OCR)
    quality: Retrieval-quality evaluation (seeded ChromaDB required)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning
log_cli = true
log_cli_level = WARNING
